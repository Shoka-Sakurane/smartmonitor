<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SmartMonitor</title>

  <style>
    :root {
      --bg: #eef2f1;
      --card: #fff;
      --tx: #14211f;
      --mut: #5d6f6b;
      --ac: #0b6e5f;
      --bd: #d3dedb;
      --bad: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1716;
        --card: #16231f;
        --tx: #e4efec;
        --mut: #8fa5a0;
        --ac: #3fd0b4;
        --bd: #25382f;
        --bad: #ff8a80;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 15px/1.5 system-ui, sans-serif;
      background: var(--bg);
      color: var(--tx);
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    h2 {
      font-size: 1.1rem;
      margin: 24px 0 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .val {
      font-size: 2rem;
      font-weight: 700;
    }

    .mut {
      color: var(--mut);
      font-size: 0.85rem;
    }

    .out .val {
      color: var(--bad);
    }

    input,
    select,
    button {
      font: inherit;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
    }

    button {
      background: var(--ac);
      color: var(--card);
      border-color: var(--ac);
      cursor: pointer;
    }

    button.ghost {
      background: none;
      color: var(--ac);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 2px;
    }

    form {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .err {
      color: var(--bad);
      min-height: 1.4em;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <!-- Pantalla de inicio de sesión -->
    <section
      id="login"
      class="card"
      hidden
      style="max-width: 360px; margin: 12vh auto 0"
    >
      <h1>SmartMonitor</h1>

      <p class="mut">
        Inicia sesión para ver tus sensores.
      </p>

      <form
        id="loginForm"
        style="flex-direction: column; align-items: stretch"
      >
        <input
          name="username"
          placeholder="Usuario"
          autocomplete="username"
          required
        >

        <input
          name="password"
          type="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit">Iniciar sesión</button>

        <div class="err" id="loginErr"></div>
      </form>
    </section>

    <!-- Aplicación principal -->
    <section id="app" hidden>
      <header>
        <h1>SmartMonitor</h1>

        <div>
          <span class="mut" id="who"></span>
          <button class="ghost" id="logout" type="button">
            Cerrar sesión
          </button>
        </div>
      </header>

      <!-- Tarjetas de sensores -->
      <div class="grid" id="cards"></div>

      <!-- Formulario visible únicamente para administradores -->
      <div id="adminBox" hidden>
        <h2 id="sensorFormTitle">Agregar sensor</h2>

        <form id="sensorForm" class="card">
          <input
            name="name"
            placeholder="Nombre"
            required
          >

          <select name="type">
            <option>temperatura</option>
            <option>humedad</option>
            <option>consumo</option>
            <option>presion</option>
          </select>

          <input
            name="min_value"
            type="number"
            step="any"
            placeholder="Mínimo"
            required
            style="width: 100px"
          >

          <input
            name="max_value"
            type="number"
            step="any"
            placeholder="Máximo"
            required
            style="width: 100px"
          >

          <button id="sensorSubmit" type="submit">
            Guardar sensor
          </button>

          <button
            id="cancelEdit"
            type="button"
            class="ghost"
            hidden
          >
            Cancelar edición
          </button>

          <span class="err" id="sensorErr"></span>
        </form>
      </div>
    </section>
  </main>

  <script>
    // Busca un elemento en la página.
    const $ = selector => document.querySelector(selector);

    // Evita insertar texto como HTML sin escaparlo.
    const esc = text => String(text).replace(
      /[&<>"']/g,
      character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character])
    );

    // Realiza peticiones a la API.
    async function api(path, opts = {}) {
      const response = await fetch('/api/' + path, {
        headers: {
          'Content-Type': 'application/json'
        },
        ...opts,
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || 'Error inesperado');
      }

      return data;
    }

    let me = null;
    let timer = null;

    // Si es null, el formulario crea un sensor.
    // Si contiene un ID, el formulario edita ese sensor.
    let editingSensorId = null;

    // Guarda los sensores obtenidos en la última actualización.
    let currentSensors = [];

    function resetSensorForm() {
      editingSensorId = null;

      $('#sensorForm').reset();
      $('#sensorFormTitle').textContent = 'Agregar sensor';
      $('#sensorSubmit').textContent = 'Guardar sensor';
      $('#cancelEdit').hidden = true;
      $('#sensorErr').textContent = '';
    }

    function view(logged) {
      $('#login').hidden = logged;
      $('#app').hidden = !logged;

      clearInterval(timer);

      if (logged) {
        refresh();
        timer = setInterval(refresh, 3000);
      } else {
        resetSensorForm();
        currentSensors = [];
      }
    }

    // Actualiza las tarjetas con las lecturas más recientes.
    async function refresh() {
      try {
        const rows = await api('readings/latest');

        currentSensors = rows;

        $('#cards').innerHTML = rows.length
          ? rows.map(sensor => {
              const out =
                sensor.value != null &&
                (
                  sensor.value < sensor.min_value ||
                  sensor.value > sensor.max_value
                );

              return `
                <div class="card ${out ? 'out' : ''}">
                  <div>${esc(sensor.name)}</div>

                  <div class="val">
                    ${sensor.value ?? '—'}
                    <small>${esc(sensor.unit)}</small>
                  </div>

                  <div class="mut">
                    Rango ${sensor.min_value}–${sensor.max_value}
                    ${esc(sensor.unit)}
                    ${out ? ' · fuera de rango' : ''}
                  </div>

                  ${
                    me.role === 'admin'
                      ? `
                        <button
                          class="ghost"
                          type="button"
                          data-edit="${sensor.id}"
                        >
                          Editar
                        </button>

                        <button
                          class="ghost"
                          type="button"
                          data-del="${sensor.id}"
                        >
                          Eliminar
                        </button>
                      `
                      : ''
                  }
                </div>
              `;
            }).join('')
          : '<p class="mut">Aún no hay sensores.</p>';
      } catch {
        view(false);
      }
    }

    // Inicio de sesión.
    $('#loginForm').onsubmit = async event => {
      event.preventDefault();

      const form = Object.fromEntries(
        new FormData(event.target)
      );

      try {
        me = await api('login', {
          method: 'POST',
          body: form
        });

        $('#who').textContent = `${me.username} (${me.role})`;
        $('#adminBox').hidden = me.role !== 'admin';
        $('#loginErr').textContent = '';

        view(true);
      } catch (error) {
        $('#loginErr').textContent = error.message;
      }
    };

    // Cierre de sesión.
    $('#logout').onclick = async () => {
      try {
        await api('logout', { method: 'POST' });
        me = null;
        view(false);
      } catch (error) {
        alert(error.message);
      }
    };

    // Cancela la edición y vuelve al formulario de creación.
    $('#cancelEdit').onclick = resetSensorForm;

    // Crear o editar un sensor.
    $('#sensorForm').onsubmit = async event => {
      event.preventDefault();

      const form = Object.fromEntries(
        new FormData(event.target)
      );

      try {
        if (editingSensorId === null) {
          // Crear un sensor nuevo.
          await api('sensors', {
            method: 'POST',
            body: form
          });
        } else {
          // Buscar el sensor para conservar su estado activo.
          const sensor = currentSensors.find(
            item => item.id === editingSensorId
          );

          if (!sensor) {
            throw new Error('El sensor ya no está disponible');
          }

          // Actualizar el sensor existente.
          await api(`sensors/${editingSensorId}`, {
            method: 'PUT',
            body: {
              ...form,
              active: Boolean(sensor.active)
            }
          });
        }

        resetSensorForm();
        await refresh();
      } catch (error) {
        $('#sensorErr').textContent = error.message;
      }
    };

    // Botones de editar y eliminar.
    $('#cards').onclick = async event => {
      const editId = event.target.dataset.edit;
      const deleteId = event.target.dataset.del;

      if (editId) {
        const sensor = currentSensors.find(
          item => item.id === Number(editId)
        );

        if (!sensor) {
          $('#sensorErr').textContent = 'Sensor no encontrado';
          return;
        }

        editingSensorId = sensor.id;

        const form = $('#sensorForm');

        form.elements.name.value = sensor.name;
        form.elements.type.value = sensor.type;
        form.elements.min_value.value = sensor.min_value;
        form.elements.max_value.value = sensor.max_value;

        $('#sensorFormTitle').textContent = 'Editar sensor';
        $('#sensorSubmit').textContent = 'Guardar cambios';
        $('#cancelEdit').hidden = false;
        $('#sensorErr').textContent = '';

        form.elements.name.focus();
        return;
      }

      if (
        deleteId &&
        confirm('¿Eliminar este sensor y su historial?')
      ) {
        try {
          await api(`sensors/${deleteId}`, {
            method: 'DELETE'
          });

          if (editingSensorId === Number(deleteId)) {
            resetSensorForm();
          }

          await refresh();
        } catch (error) {
          $('#sensorErr').textContent = error.message;
        }
      }
    };

    // Recupera la sesión si el usuario ya había iniciado sesión.
    api('me')
      .then(user => {
        me = user;

        $('#who').textContent = `${user.username} (${user.role})`;
        $('#adminBox').hidden = user.role !== 'admin';

        view(true);
      })
      .catch(() => view(false));
  </script>
</body>
</html>
